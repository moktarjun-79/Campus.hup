<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Messages | CampusHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="dashboard-body">
  <main class="container py-5">
    <a href="dashboard.html" class="btn btn-outline-primary mb-4">Back to Dashboard</a>
    <h1>Student Messages</h1>
    <div id="messages" class="mt-4"></div>
  </main>
  
  <script>
    var messages = JSON.parse(localStorage.getItem("campushub_contact_messages") || "[]");
    var box = document.getElementById("messages");
    if (messages.length === 0) {
      box.textContent = "No messages yet.";
    } else {
      messages.slice().reverse().forEach(function (m) {
        var card = document.createElement("div");
        card.className = "card p-3 mb-3";
        ["Name: " + m.name, "Email: " + m.email, "Subject: " + m.subject, "Message: " + m.message, m.date].forEach(function (line) {
          var p = document.createElement("p");
          p.className = "mb-1";
          p.textContent = line;
          card.appendChild(p);
        });
        box.appendChild(card);
      });
    }
  </script>
</body>
</html>
